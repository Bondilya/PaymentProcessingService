[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "integration: marks tests as integration tests (require external services)",
]

[tool.ruff]
target-version = "py312"
line-length = 120
src = [".", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "TCH"]

[tool.ruff.lint.isort]
known-first-party = ["payment_service"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["payment_service"]
mypy_path = "."

[[tool.mypy.overrides]]
module = "faststream.*"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false
