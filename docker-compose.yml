version: "3.9"

services:
  db:
    image: postgres:18.4-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB__NAME}
      POSTGRES_USER: ${DB__USER}
      POSTGRES_PASSWORD: ${DB__PASSWORD}
      PGDATA: "/var/lib/postgresql/data/pgdata"
    volumes:
      - ./data/pgdata:/var/lib/postgresql/data
    ports:
      - "${DB__PORT}:${DB__PORT}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB__USER} -d ${DB__NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  broker:
    image: rabbitmq:4.3.4-alpine
    container_name: rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${BROKER__USER}
      RABBITMQ_DEFAULT_PASS: ${BROKER__PASSWORD}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit log_levels [{connection,error},{default,error}] disk_free_limit 2147483648"
    volumes:
      - ./data/rabbitmq:/var/lib/rabbitmq
    ports:
      - "${BROKER__PORT}:${BROKER__PORT}"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payment-api
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy
    ports:
      - "${API__PORT}:${API__PORT}"
    command: >
      sh -c "alembic upgrade head &&
             python -m payment_service.api.start"

  consumer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payment-consumer
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python -m payment_service.consumer.start"
